<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:var(--text);font:12px/1.5 system-ui}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}strong{font-size:27px;letter-spacing:-1px}p{margin:2px 0;color:var(--muted)}button{padding:9px 12px;background:var(--accent);color:#171321;border:0;border-radius:10px;cursor:pointer}.detail{margin-top:12px}.small .detail{display:none}</style></head><body><div class="row"><div><strong id="n">Your next story</strong><p id="status">Private studio</p></div><button onclick="orbit.open()">Open ↗</button></div><p class="detail" id="detail">Words → scenes → voice → film</p><script>document.body.className=orbit.widget?.size||'medium';function show(d){const j=Object.entries(d).filter(([k])=>k.startsWith('index_')).map(([,v])=>v);const active=j.filter(x=>['queued','working'].includes(x.status)),ready=j.filter(x=>x.type==='render'&&x.status==='done');document.getElementById('n').textContent=active.length?active.length+' in progress':ready.length?ready.length+' films ready':'Your next story';document.getElementById('status').textContent=active[0]?.stage||'Private trial · start with an image or link';document.getElementById('detail').textContent=ready.at(-1)?.title||'Preview pronunciation before the full render.'}orbit.data.all().then(show);orbit.onChange(show)</script></body></html>
